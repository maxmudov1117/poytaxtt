<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Poytaxt Taxi &mdash; fikrlar bo'limi, maket</title>

  <meta name="theme-color" content="#f5f8fc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1a27" media="(prefers-color-scheme: dark)" />

  <link rel="preload" href="fonts/golos-latin.woff2" as="font" type="font/woff2" crossorigin />
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/ui.css" />
</head>

<body>

  <!-- ============================================================ notice -->
  <div class="pv">
    <div class="wrap pv__in">
      <b>Maket.</b>
      Ikkitasi haqiqiy fikr, qolgan yettitasi &mdash; joy egallash uchun namuna.
      Bu sahifa saytga ulanmagan va qidiruvga chiqmaydi.
    </div>
  </div>

  <!-- ========================================================== fikrlar -->
  <section class="voices panel" id="fikrlar">
    <canvas class="checker" data-checker=".voices__in" aria-hidden="true"></canvas>
    <span class="panel__lit" aria-hidden="true"></span>

    <div class="wrap voices__in">
      <div class="voices__hd">
        <h2 class="voices__t">Mijozlar biz haqimizda</h2>
        <p class="voices__sub">2019 yildan beri qatnayotganlar</p>
      </div>

    </div>

      <!-- REPLACE BEFORE LAUNCH -------------------------------------
           The bottom row holds the two real fikrs, in full. The top row is
           placeholders only - short quotes go there as they arrive, and
           each placeholder carries a visible "Namuna" tag until it does.
           ---------------------------------------------------------- -->
      <div class="voices__rows">
        <div class="voices__vp voices__vp--sm" data-voices-vp data-dir="1" data-speed="30">
          <div class="voices__track">
            <figure class="voice" data-sample>
              <figcaption>
                <span class="voice__mono" aria-hidden="true">1</span>
                <span class="voice__who">
                  <b>Mijoz ismi</b>
                  <span>Roli</span>
                </span>
                <span class="voice__tag">Namuna</span>
              </figcaption>
              <blockquote>Qisqa fikr shu yerda turadi &mdash; ikki qatorga sig'adigan uzunlikda.</blockquote>
            </figure>
            <figure class="voice" data-sample>
              <figcaption>
                <span class="voice__mono" aria-hidden="true">2</span>
                <span class="voice__who">
                  <b>Mijoz ismi</b>
                  <span>Roli</span>
                </span>
                <span class="voice__tag">Namuna</span>
              </figcaption>
              <blockquote>Qisqa fikr shu yerda turadi &mdash; ikki qatorga sig'adigan uzunlikda.</blockquote>
            </figure>
            <figure class="voice" data-sample>
              <figcaption>
                <span class="voice__mono" aria-hidden="true">3</span>
                <span class="voice__who">
                  <b>Mijoz ismi</b>
                  <span>Roli</span>
                </span>
                <span class="voice__tag">Namuna</span>
              </figcaption>
              <blockquote>Qisqa fikr shu yerda turadi &mdash; ikki qatorga sig'adigan uzunlikda.</blockquote>
            </figure>
            <figure class="voice" data-sample>
              <figcaption>
                <span class="voice__mono" aria-hidden="true">4</span>
                <span class="voice__who">
                  <b>Mijoz ismi</b>
                  <span>Roli</span>
                </span>
                <span class="voice__tag">Namuna</span>
              </figcaption>
              <blockquote>Qisqa fikr shu yerda turadi &mdash; ikki qatorga sig'adigan uzunlikda.</blockquote>
            </figure>
            <figure class="voice" data-sample>
              <figcaption>
                <span class="voice__mono" aria-hidden="true">5</span>
                <span class="voice__who">
                  <b>Mijoz ismi</b>
                  <span>Roli</span>
                </span>
                <span class="voice__tag">Namuna</span>
              </figcaption>
              <blockquote>Qisqa fikr shu yerda turadi &mdash; ikki qatorga sig'adigan uzunlikda.</blockquote>
            </figure>
            <figure class="voice" data-sample>
              <figcaption>
                <span class="voice__mono" aria-hidden="true">6</span>
                <span class="voice__who">
                  <b>Mijoz ismi</b>
                  <span>Roli</span>
                </span>
                <span class="voice__tag">Namuna</span>
              </figcaption>
              <blockquote>Qisqa fikr shu yerda turadi &mdash; ikki qatorga sig'adigan uzunlikda.</blockquote>
            </figure>
          </div>
        </div>

        <div class="voices__vp voices__vp--lg" data-voices-vp data-dir="-1" data-speed="21">
          <div class="voices__track">
            <figure class="voice">
              <figcaption>
                <span class="voice__mono" aria-hidden="true">U</span>
                <span class="voice__who">
                  <b>Umarbek</b>
                  <span>Doimiy mijoz</span>
                </span>
              </figcaption>
              <blockquote>Salkam 5 yildan beri shu taksi kompaniyadan foydalanaman, qulay narxlar, ishonchli va tajribali haydovchilar. Hammaga tavsiya qilaman.</blockquote>
            </figure>
            <figure class="voice">
              <figcaption>
                <span class="voice__mono" aria-hidden="true">Z</span>
                <span class="voice__who">
                  <b>Zulfiya</b>
                  <span>Talaba</span>
                </span>
              </figcaption>
              <blockquote>Talabalar uchun eng yaxshi tanlov deb bilaman &mdash; mashinalar holati, salon ozodaligi. Ushbu kompaniyani o'z tengdoshlarimga tavsiya qilaman.</blockquote>
            </figure>
          </div>
        </div>
      </div>
  </section>

  <script src="js/ui.js"></script>
</body>

</html>
